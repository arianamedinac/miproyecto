<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Video con capas</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:sans-serif; }
    #boton-play {
      position:fixed; bottom:25px; left:50%; transform:translateX(-50%);
      z-index:999; padding:14px 24px; background:#111; color:#fff;
      border:none; border-radius:30px; font-size:16px;
    }
    #estado-ar {
      position:fixed; top:16px; left:50%; transform:translateX(-50%);
      z-index:999; max-width:90%; background:rgba(0,0,0,.75); color:#fff;
      padding:8px 14px; border-radius:12px; font-size:13px; text-align:center;
    }
  </style>
</head>
<body>
  <div id="estado-ar">Cargando cámara...</div>
  <button id="boton-play">Toca aquí para activar audio y video</button>

  <a-scene id="escena-ar"
           mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 5"
           color-space="sRGB"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="miVideo" src="./video.mp4" preload="auto" loop="true"
             playsinline="true" webkit-playsinline="true" crossorigin="anonymous"></video>
      <img id="capa1" src="./capa1.png" />
      <img id="capa2" src="./capa2.png" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="objetivo-pin" mindar-image-target="targetIndex: 0">

      <!-- Video (fondo) -->
      <a-plane src="#miVideo" width="1" height="1" position="0 0 0.05"
               material="shader: flat"></a-plane>

      <!-- Capa 1: logo con movimiento -->
      <a-plane src="#capa1" width="0.35" height="0.35" position="-0.3 0.4 0.3"
               material="transparent: true; shader: flat; alphaTest: 0.1"
               animation__flotar="property: position; from: -0.3 0.4 0.3; to: -0.3 0.44 0.3; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine"
               animation__balanceo="property: rotation; from: 0 0 -5; to: 0 0 5; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine"
               animation__pulso="property: scale; from: 1 1 1; to: 1.08 1.08 1; dur: 1200; dir: alternate; loop: true; easing: easeInOutSine"></a-plane>

      <!-- Capa 2: imagen con texto -->
      <a-plane src="#capa2" width="0.9" height="0.3" position="0 -0.65 0.45"
               material="transparent: true; shader: flat; alphaTest: 0.1"></a-plane>

    </a-entity>
  </a-scene>

  <script>
    const btn = document.getElementById('boton-play');
    const vid = document.getElementById('miVideo');
    const estado = document.getElementById('estado-ar');
    const escena = document.getElementById('escena-ar');
    const objetivo = document.getElementById('objetivo-pin');

    let desbloqueado = false;
    let pinVisible = false;

    vid.addEventListener('error', () => {
      estado.textContent = 'No cargó video.mp4. Revisa nombre y formato (H.264/AAC).';
    });
    escena.addEventListener('arReady', () => {
      estado.textContent = 'Cámara lista. Enfoca tu imagen.';
    });
    escena.addEventListener('arError', (e) => {
      estado.textContent = 'Error al iniciar la cámara. Revisa permisos o targets.mind.';
      console.log('arError', e);
    });
    objetivo.addEventListener('targetFound', () => {
      pinVisible = true;
      estado.textContent = 'Imagen detectada.';
      if (desbloqueado) vid.play().catch(() => {});
    });
    objetivo.addEventListener('targetLost', () => {
      pinVisible = false;
      estado.textContent = 'Enfoca tu imagen nuevamente.';
      vid.pause();
    });

    btn.addEventListener('click', async () => {
      try {
        vid.muted = false;
        await vid.play();
        desbloqueado = true;
        if (!pinVisible) { vid.pause(); vid.currentTime = 0; }
        btn.style.display = 'none';
        estado.textContent = pinVisible ? 'Imagen detectada.' : 'Listo. Enfoca tu imagen.';
      } catch (err) {
        estado.textContent = 'El navegador bloqueó el audio/video o falta el archivo.';
      }
    });
  </script>
</body>
</html>
