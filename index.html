<!DOCTYPE html>
<html lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Recuerdo con Video</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mindar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: sans-serif;
      }
      #boton-play {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        padding: 14px 24px;
        background: #111;
        color: #fff;
        border: none;
        border-radius: 30px;
        font-size: 16px;
      }
      #estado-ar {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        max-width: 90%;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 8px 14px;
        border-radius: 12px;
        font-size: 13px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="estado-ar">Listo. Toca el botón para activar audio y video.</div>
    <button id="boton-play">Toca aquí para activar audio y video</button>

    <a-scene
      id="escena-ar"
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="miVideo"
          src="./video.mp4"
          preload="auto"
          loop="true"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="objetivo-pin" mindar-image-target="targetIndex: 0">
        <a-plane src="#miVideo" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      const btn = document.getElementById('boton-play');
      const vid = document.getElementById('miVideo');
      const estado = document.getElementById('estado-ar');
      const escena = document.getElementById('escena-ar');
      const objetivo = document.getElementById('objetivo-pin');

      window.addEventListener('error', (e) => {
        estado.textContent = 'Error en página: ' + (e.message || 'revisa archivos en GitHub');
      });

      vid.addEventListener('error', () => {
        estado.textContent = 'No cargó video.mp4. Revisa que exista en el repositorio.';
      });

      escena.addEventListener('arReady', () => {
        estado.textContent = 'Cámara lista. Enfoca tu pin.';
      });

      escena.addEventListener('arError', () => {
        estado.textContent = 'Error al iniciar AR/cámara. Revisa permisos o targets.mind.';
      });

      objetivo.addEventListener('targetFound', () => {
        estado.textContent = 'Pin detectado.';
        vid.play().catch(() => {});
      });

      objetivo.addEventListener('targetLost', () => {
        estado.textContent = 'Enfoca tu pin nuevamente.';
      });

      btn.addEventListener('click', async () => {
        btn.style.display = 'none';
        estado.textContent = 'Activando video y cámara...';
        try {
          vid.muted = false;
          await vid.play();
        } catch (err) {
          estado.textContent = 'El navegador bloqueó el audio/video o falta cargar el archivo.';
        }
      });
    </script>
  </body>
</html>
