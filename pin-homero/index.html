<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pin con capas</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:sans-serif; }
    #estado-ar {
      position:fixed; top:16px; left:50%; transform:translateX(-50%);
      z-index:999; max-width:90%; background:rgba(0,0,0,.75); color:#fff;
      padding:8px 14px; border-radius:12px; font-size:13px; text-align:center;
    }
  </style>
</head>
<body>
  <div id="estado-ar">Cargando cámara...</div>

  <a-scene id="escena-ar"
           mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 5"
           color-space="sRGB"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="capa1" src="./capa1.png" />
      <img id="capa2" src="./capa2.png" />
      <img id="capa3" src="./capa3.png" />
      <img id="capa4" src="./capa4.png" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="objetivo-pin" mindar-image-target="targetIndex: 0">

      <!-- Capa 1: fondo -->
      <a-plane src="#capa1" width="1" height="1" position="0 0 0.05"
               material="transparent: true; shader: flat; alphaTest: 0.1"></a-plane>

      <!-- Capa 2: personaje -->
      <a-plane src="#capa2" width="0.7" height="0.7" position="0 0 0.2"
               material="transparent: true; shader: flat; alphaTest: 0.1"></a-plane>

      <!-- Capa 3: objeto, flotando suave -->
      <a-plane src="#capa3" width="0.35" height="0.35" position="0.3 -0.3 0.35"
               material="transparent: true; shader: flat; alphaTest: 0.1"
               animation="property: position; to: 0.3 -0.26 0.35; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine"></a-plane>

      <!-- Capa 4: texto o detalle al frente -->
      <a-plane src="#capa4" width="0.8" height="0.25" position="0 0.6 0.5"
               material="transparent: true; shader: flat; alphaTest: 0.1"
               animation="property: position; to: 0 0.64 0.5; dur: 2500; dir: alternate; loop: true; easing: easeInOutSine"></a-plane>

    </a-entity>
  </a-scene>

  <script>
    const estado = document.getElementById('estado-ar');
    const escena = document.getElementById('escena-ar');
    const objetivo = document.getElementById('objetivo-pin');

    escena.addEventListener('arReady', () => { estado.textContent = 'Cámara lista. Enfoca la imagen.'; });
    escena.addEventListener('arError', (e) => {
      estado.textContent = 'Error al iniciar la cámara. Revisa permisos o targets.mind.';
      console.log('arError', e);
    });
    objetivo.addEventListener('targetFound', () => { estado.textContent = 'Imagen detectada.'; });
    objetivo.addEventListener('targetLost', () => { estado.textContent = 'Enfoca la imagen nuevamente.'; });
  </script>
</body>
</html>
